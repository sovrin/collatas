# collatas behind your own reverse proxy: put the proxy, its network and the public address in an
# untracked compose.override.yaml next to this file. On its own, the web service listens on
# loopback only.
name: collatas
services:
  web:
    container_name: collatas
    build:
      context: .
      target: web
      additional_contexts:
        aequitas: ${AEQUITAS_DIST:-../aequitas/dist}
    environment:
      COLLATAS_DATA_DIR: /data
      COLLATAS_ORIGIN: ${COLLATAS_ORIGIN:-http://localhost:3000}
      COLLATAS_BOOTSTRAP_TOKEN: ${COLLATAS_BOOTSTRAP_TOKEN:?Set a random installation key of at least 32 characters}
    ports:
      - ${COLLATAS_BIND:-127.0.0.1:3000}:3000
    volumes:
      - collatas-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  collatas-data:
